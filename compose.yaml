services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: admissions
      POSTGRES_USER: admissions
      POSTGRES_PASSWORD: admissions
    ports:
      - "5432:5432"
    volumes:
      - admissions_db:/var/lib/postgresql/data
      - ./infra/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admissions"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  admissions_db:

